<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Clang Test</title>
</head>
<body>
<pre id="out">Loading...</pre>

<script type="module">
import { commands } from "./gen/bundle.js";

const out = document.getElementById("out");

let text = "";

const append = bytes => {
    if (bytes)
        text += new TextDecoder().decode(bytes);
};

try {
    await commands.clang(
        ["--version"],
        {},
        {
            stdout: append,
            stderr: append
        }
    );

    out.textContent = text || "No output";
}
catch (e) {
    out.textContent =
        "ERROR:\n\n" +
        String(e) +
        "\n\n" +
        (e?.stack || "");
    console.error(e);
}
</script>

</body>
</html>
